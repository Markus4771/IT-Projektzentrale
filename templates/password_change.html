{% extends 'base.html' %}{% block content %}
<div class="login"><h1>Passwort ändern</h1>
{% if current_user.must_change_password %}<div class="notice">Vor der weiteren Nutzung muss das Initialpasswort geändert werden.</div>{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <label>Aktuelles Passwort<input name="current_password" type="password" autocomplete="current-password" required></label>
  <label>Neues Passwort<input name="new_password" type="password" autocomplete="new-password" minlength="12" required></label>
  <label>Neues Passwort wiederholen<input name="confirmation" type="password" autocomplete="new-password" minlength="12" required></label>
  <button>Passwort speichern</button>
</form>
<p><small>Mindestens 12 Zeichen verwenden.</small></p>
</div>{% endblock %}
