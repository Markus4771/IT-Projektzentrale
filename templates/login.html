{% extends 'base.html' %}{% block content %}
<div class="login"><h1>Anmeldung</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post"><label>Benutzername<input name="username" autocomplete="username" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" required></label><button>Anmelden</button></form>
<p><small>Das einmalige Initialpasswort wird bei der Installation erzeugt. Beim ersten Login muss es geändert werden.</small></p>
</div>{% endblock %}
