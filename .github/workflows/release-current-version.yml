name: Aktuelle Version veröffentlichen

on:
  push:
    branches:
      - main
    paths:
      - version.txt
      - app/**
      - debian/**
      - systemd/**
      - scripts/build_deb.sh
      - requirements.txt
      - .github/workflows/release-current-version.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-current-version
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Version bestimmen
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < version.txt)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prüfen, ob das Release bereits existiert
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Debian-Paket bauen
        if: steps.existing.outputs.exists != 'true'
        run: bash scripts/build_deb.sh

      - name: Paket prüfen
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE="dist/it-projektzentrale_${VERSION}_all.deb"
          test -f "$PACKAGE"
          test -f "$PACKAGE.sha256"
          dpkg-deb --info "$PACKAGE"
          sha256sum -c "$PACKAGE.sha256"

      - name: GitHub-Release mit Debian-Paket erstellen
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/it-projektzentrale_${VERSION}_all.deb" \
            "dist/it-projektzentrale_${VERSION}_all.deb.sha256" \
            --target "$GITHUB_SHA" \
            --title "IT-Projektzentrale ${VERSION}" \
            --generate-notes
