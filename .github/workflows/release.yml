name: Debian Release

on:
  push:
    branches: [main]
    paths:
      - version.txt
      - app/**
      - agent/**
      - templates/**
      - static/**
      - systemd/**
      - scripts/**
      - debian/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version bestimmen
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < version.txt)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Tests und Syntaxprüfung
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt -r requirements-dev.txt
          python3 -m compileall -q app agent/itpz-agent.py scripts/itpz-helper scripts/itpz-install-worker scripts/itpz-compose-helper
          python3 -m pytest -q
          bash -n install.sh scripts/build_deb.sh scripts/build_agent_deb.sh
          sh -n debian/postinst debian/prerm debian/postrm
      - name: Debian-Pakete bauen
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_deb.sh
          bash scripts/build_agent_deb.sh
          VERSION='${{ steps.version.outputs.version }}'
          MAIN="dist/it-projektzentrale_${VERSION}_all.deb"
          AGENT="dist/itpz-agent_${VERSION}_all.deb"
          test -f "$MAIN" && test -f "$AGENT"
          dpkg-deb --info "$MAIN" && dpkg-deb --info "$AGENT"
          cp "$MAIN" dist/it-projektzentrale_latest_all.deb
          cp "$AGENT" dist/itpz-agent_latest_all.deb
          sha256sum dist/it-projektzentrale_latest_all.deb > dist/it-projektzentrale_latest_all.deb.sha256
          sha256sum dist/itpz-agent_latest_all.deb > dist/itpz-agent_latest_all.deb.sha256
      - name: Release erstellen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            "dist/it-projektzentrale_${VERSION}_all.deb"
            "dist/it-projektzentrale_${VERSION}_all.deb.sha256"
            "dist/it-projektzentrale_latest_all.deb"
            "dist/it-projektzentrale_latest_all.deb.sha256"
            "dist/itpz-agent_${VERSION}_all.deb"
            "dist/itpz-agent_${VERSION}_all.deb.sha256"
            "dist/itpz-agent_latest_all.deb"
            "dist/itpz-agent_latest_all.deb.sha256"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            gh release create "$TAG" "${FILES[@]}" --title "IT-Projektzentrale ${VERSION}" --generate-notes --latest
          fi
