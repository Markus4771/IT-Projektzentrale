name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python-Syntax prüfen
        run: python3 -m compileall -q app agent/itpz-agent.py scripts/itpz-helper scripts/itpz-install-worker scripts/itpz-compose-helper scripts/itpz-monitor-worker
      - name: Testabhängigkeiten installieren
        run: python3 -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Automatisierte Tests
        run: python3 -m pytest -q
      - name: Shell-Syntax prüfen
        run: |
          bash -n install.sh scripts/build_deb.sh scripts/build_agent_deb.sh
          sh -n debian/postinst debian/prerm debian/postrm
      - name: Debian-Pakete bauen
        run: |
          bash scripts/build_deb.sh
          bash scripts/build_agent_deb.sh
      - name: Pakete prüfen
        run: |
          MAIN=$(find dist -maxdepth 1 -type f -name 'it-projektzentrale_*.deb' -print -quit)
          AGENT=$(find dist -maxdepth 1 -type f -name 'itpz-agent_*.deb' -print -quit)
          test -n "$MAIN" && test -n "$AGENT"
          dpkg-deb --info "$MAIN" && dpkg-deb --info "$AGENT"
          sha256sum -c "$MAIN.sha256" && sha256sum -c "$AGENT.sha256"
          dpkg-deb --contents "$MAIN" | grep -Eq 'it-projektzentrale-worker.service$'
          dpkg-deb --contents "$MAIN" | grep -Eq 'it-projektzentrale-monitor.service$'
          dpkg-deb --contents "$MAIN" | grep -Eq 'itpz-monitor-worker$'
          dpkg-deb --contents "$MAIN" | grep -Eq 'itpz-compose-helper$'
          dpkg-deb --contents "$AGENT" | grep -Eq 'itpz-agent.service$'
          dpkg-deb --contents "$AGENT" | grep -Eq 'itpz-agent.py$'
          dpkg-deb --contents "$AGENT" | grep -Eq 'srv/itpz-compose'
      - name: Build-Artefakte bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: it-projektzentrale-${{ github.sha }}
          path: |
            dist/*.deb
            dist/*.sha256
